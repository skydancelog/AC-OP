# 修正版说明（仅修改必要问题，其余保持原逻辑）：
# 1. 修复 docker rmi 空参数报错
# 2. 修复 gn 包不存在导致 apt install 失败
# 3. 修复 svn co GitHub 网页地址错误（改为 trunk）
# 4. 升级 actions/upload-artifact 与 checkout 版本
# 5. 修复旧版 set-output 问题（改为 GITHUB_OUTPUT）
# 6. 保留原有注释、原有结构、原有编译逻辑
#============================================================

#G20230522-am0041
name: CR660X

on:
  repository_dispatch:

  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

  # schedule:
  #   - cron: 0 21 * * *
  # 每天晚上凌晨0点自动编译

  # watch:
  #   types: started

  # - cron: 0 8 */5 * *
  # - cron: 0 22,14 * * *
  # 每天运行两次，在上午 6 点和晚上 22 点

  # - cron: 0 20 * * fri
  # 每周五凌晨四点自动编译

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/CR660X.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai
  FILE_NAME: CR660X
  PRODUCT_NAME: CR660X

jobs:
  build:
    runs-on: ubuntu-22.04

    # if: github.event.repository.owner.id == github.event.sender.id

    steps:

    #- name: WeChat notification
    #  run: curl https://sc.ftqq.com/${{ secrets.ServerChan }}.send?text=${{ env.FILE_NAME }}开始编译

    #============================================================
    # 拉取仓库代码
    #============================================================
    - name: Checkout
      uses: actions/checkout@v4

    #============================================================
    # 初始化编译环境
    #============================================================
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |

        # 修复点 1：避免 docker images -q 为空时报错
        # 原来：docker rmi `docker images -q`
        if [[ -n "$(docker images -q)" ]]; then
          docker rmi $(docker images -q)
        fi

        [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"

        sudo rm -rf /etc/apt/sources.list.d/* \
          /usr/share/dotnet \
          /etc/mysql \
          /etc/php \
          /usr/local/lib/android \
          /opt/ghc

        sudo -E apt-get -y purge \
          azure-cli ghc* zulu* hhvm llvm* firefox google* \
          dotnet* powershell openjdk* adoptopenjdk* \
          mysql* php* mongodb* moby* snapd* || true

        sudo -E apt-get -qq update

        sudo -E apt-get -qq install \
          ack antlr3 aria2 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 ccache cmake cpio curl \
          device-tree-compiler fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
          pkgconf python3 python3-pip libpython3-dev qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip vim wget xmlto xxd zlib1g-dev

        sudo -E apt-get -qq install time

        # 修复点 2：gn 包经常不存在
        # 原来：sudo -E apt-get -qq install gn
        # 改为：generate-ninja（兼容性更好）
        sudo -E apt-get -qq install generate-ninja || true

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

        df -Th

    #============================================================
    # 检查服务器性能
    #============================================================
    - name: Check server performance
      run: |
        echo "警告⚠"
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo "已知编译成功CPU型号：8370C,8171M"
        echo "已知性能不足CPU型号：8272CL"

        echo -e "-------------- ------------CPU信息------------------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo | grep 'physical id' | sort | uniq | wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"

        echo "-------------------------------内存信息-------------------------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"

        echo "-----------------------------硬盘信息---------------------------------------------"
        echo -e "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "硬盘详情："
        df -Th

    #============================================================
    # 拉取 OpenWrt 源码
    #============================================================
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD

        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

        cd openwrt

        useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
        echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
        echo "DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
        echo "DATE1=$(date '+%Y-%m-%d')" >> $GITHUB_ENV

        # 修复点 3：GitHub 网页地址不能直接 svn co
        # 原来：.../tree/main/...
        # 正确：.../trunk/...
        svn co https://github.com/kenzok8/small-package/trunk/luci-app-passwall package/luci-app-passwall || true
